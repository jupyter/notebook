name: Binder Badge
on:
  pull_request_target:
    types: [opened]

permissions:
  contents: read

jobs:
  binder:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: jupyterlab/maintainer-tools/.github/actions/binder-link@b9d5c28489f8b460cef48868f303b97c20f8fe1b # v1.1.2
        with:
          github_token: ${{ secrets.github_token }}
          url_path: tree
